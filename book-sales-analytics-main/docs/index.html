<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Sales Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
      border-bottom: 1px solid #334155;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 { font-size: 1.35rem; font-weight: 700; color: #f1f5f9; letter-spacing: -0.02em; }
    header p  { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }

    .tab-bar {
      display: flex; gap: 4px;
      padding: 16px 32px 0;
      border-bottom: 1px solid #334155;
      background: #1e293b;
    }
    .tab-btn {
      padding: 10px 24px; border: none; background: transparent;
      color: #94a3b8; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.2s;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab-btn:hover { color: #e2e8f0; background: #334155; }
    .tab-btn.active { color: #60a5fa; border-bottom-color: #3b82f6; background: #0f172a; }

    main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 28px;
    }
    .kpi-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 20px; position: relative; overflow: hidden;
    }
    .kpi-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: var(--accent, #3b82f6);
    }
    .kpi-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 8px; }
    .kpi-value { font-size: 1.7rem; font-weight: 700; color: #f1f5f9; line-height: 1.1; }
    .kpi-sub   { font-size: 0.75rem; color: #64748b; margin-top: 4px; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 900px) { .row2 { grid-template-columns: 1fr; } }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px 24px; }
    .card-title {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #64748b; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .card-title span.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, #3b82f6); flex-shrink: 0; }

    .top5-table { width: 100%; border-collapse: collapse; }
    .top5-table th {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: #475569; padding: 0 0 8px; text-align: left; font-weight: 600;
    }
    .top5-table th:last-child, .top5-table td:last-child { text-align: right; }
    .top5-table tr:not(:last-child) td { border-bottom: 1px solid #1e3351; }
    .top5-table td { padding: 10px 0; font-size: 0.875rem; }

    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 6px;
      font-size: 0.7rem; font-weight: 700; margin-right: 10px;
    }
    .rank-1 { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .rank-2 { background: rgba(148,163,184,0.12); color: #94a3b8; }
    .rank-3 { background: rgba(180,120,60,0.15); color: #c08040; }
    .rank-other { background: rgba(71,85,105,0.2); color: #64748b; }

    .revenue-bar-wrap { display: flex; align-items: center; gap: 10px; }
    .revenue-bar { flex: 1; height: 6px; background: #1e3351; border-radius: 3px; overflow: hidden; }
    .revenue-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); }
    .revenue-amt { font-size: 0.875rem; font-weight: 600; color: #60a5fa; white-space: nowrap; }

    .info-block { margin-bottom: 14px; }
    .info-block:last-child { margin-bottom: 0; }
    .info-name { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: #475569; margin-bottom: 4px; }
    .info-val  { font-size: 0.95rem; color: #e2e8f0; font-weight: 500; }

    .id-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .id-chip {
      background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25);
      color: #60a5fa; font-size: 0.78rem; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
    }

    .chart-wrap { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px 24px; margin-bottom: 4px; }
    .chart-wrap canvas { max-height: 300px; }

    .author-pill {
      display: inline-block;
      background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(59,130,246,0.12));
      border: 1px solid rgba(139,92,246,0.3); color: #a78bfa;
      font-size: 0.9rem; font-weight: 600; padding: 6px 14px; border-radius: 8px; margin-top: 4px;
    }
    .qty-badge { font-size: 0.72rem; color: #64748b; margin-left: 8px; }

    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 300px; color: #64748b; font-size: 1.1rem;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">📚</div>
  <div>
    <h1>Book Sales Analytics</h1>
    <p>Revenue insights &middot; User analytics &middot; Author performance</p>
  </div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('DATA1', this)">Dataset 1</button>
  <button class="tab-btn"        onclick="switchTab('DATA2', this)">Dataset 2</button>
  <button class="tab-btn"        onclick="switchTab('DATA3', this)">Dataset 3</button>
</div>

<main id="main-content">
  <div id="loading">Loading data…</div>
</main>

<script>
let DATA = null;
const charts = {};

function fmt(n) {
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function buildPanel(ds) {
  const d = DATA[ds];
  const maxRev = Math.max(...d.top5_days.map(r => r[1]));
  const rankClass = i => ['rank-1','rank-2','rank-3','rank-other','rank-other'][i];

  const top5Rows = d.top5_days.map((row, i) => `
    <tr>
      <td><span class="rank-badge ${rankClass(i)}">${i+1}</span>${row[0]}</td>
      <td>
        <div class="revenue-bar-wrap">
          <div class="revenue-bar"><div class="revenue-bar-fill" style="width:${(row[1]/maxRev*100).toFixed(1)}%"></div></div>
          <span class="revenue-amt">${fmt(row[1])}</span>
        </div>
      </td>
    </tr>`).join('');

  const idChips = d.top_customer_ids.map(id => `<span class="id-chip">#${id}</span>`).join('');
  const nameList = [...new Set(d.top_customer_names)].join(', ');

  return `
  <div class="kpi-row">
    <div class="kpi-card" style="--accent:#3b82f6">
      <div class="kpi-label">Unique Users</div>
      <div class="kpi-value">${d.unique_users.toLocaleString()}</div>
      <div class="kpi-sub">After identity reconciliation</div>
    </div>
    <div class="kpi-card" style="--accent:#8b5cf6">
      <div class="kpi-label">Unique Author Sets</div>
      <div class="kpi-value">${d.unique_author_sets.toLocaleString()}</div>
      <div class="kpi-sub">Solo &amp; collaborative combos</div>
    </div>
    <div class="kpi-card" style="--accent:#10b981">
      <div class="kpi-label">Top Day Revenue</div>
      <div class="kpi-value">${fmt(d.top5_days[0][1])}</div>
      <div class="kpi-sub">${d.top5_days[0][0]}</div>
    </div>
    <div class="kpi-card" style="--accent:#f59e0b">
      <div class="kpi-label">Top Customer Spend</div>
      <div class="kpi-value">${fmt(d.top_customer_spend)}</div>
      <div class="kpi-sub">${nameList}</div>
    </div>
  </div>

  <div class="row2">
    <div class="card">
      <div class="card-title"><span class="dot" style="--dot:#f59e0b"></span>Top 5 Days by Revenue</div>
      <table class="top5-table">
        <thead><tr><th>Date</th><th>Revenue</th></tr></thead>
        <tbody>${top5Rows}</tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot" style="--dot:#8b5cf6"></span>Most Popular Author / Set</div>
      <div class="info-block">
        <div class="info-name">Author (or set)</div>
        <div class="author-pill">${d.most_popular_author}<span class="qty-badge">${d.most_popular_qty.toLocaleString()} copies sold</span></div>
      </div>
      <div class="info-block" style="margin-top:20px">
        <div class="card-title" style="margin-bottom:10px"><span class="dot" style="--dot:#10b981"></span>Top Customer</div>
        <div class="info-name">Name(s)</div>
        <div class="info-val">${nameList}</div>
        <div class="info-name" style="margin-top:10px">All User IDs</div>
        <div class="id-chips">${idChips}</div>
        <div class="info-name" style="margin-top:10px">Total Spend</div>
        <div class="info-val" style="color:#34d399;font-weight:700">${fmt(d.top_customer_spend)}</div>
      </div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="card-title"><span class="dot" style="--dot:#3b82f6"></span>Daily Revenue (USD)</div>
    <canvas id="chart-${ds}"></canvas>
  </div>`;
}

function renderChart(ds) {
  const d = DATA[ds];
  const ctx = document.getElementById(`chart-${ds}`).getContext('2d');
  if (charts[ds]) { charts[ds].destroy(); }
  charts[ds] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: d.daily_revenue.map(r => r[0]),
      datasets: [{
        data: d.daily_revenue.map(r => r[1]),
        borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.08)',
        borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4, fill: true, tension: 0.3,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1,
          titleColor: '#94a3b8', bodyColor: '#f1f5f9',
          callbacks: { label: ctx => ' ' + fmt(ctx.parsed.y) }
        }
      },
      scales: {
        x: {
          type: 'time', time: { unit: 'month', displayFormats: { month: 'MMM yyyy' } },
          grid: { color: 'rgba(51,65,85,0.5)' },
          ticks: { color: '#64748b', maxTicksLimit: 12, font: { size: 11 } }
        },
        y: {
          grid: { color: 'rgba(51,65,85,0.5)' },
          ticks: { color: '#64748b', font: { size: 11 }, callback: v => '$' + (v >= 1000 ? (v/1000).toFixed(0)+'k' : v) }
        }
      }
    }
  });
}

let currentDs = 'DATA1';

function switchTab(ds, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentDs = ds;
  document.getElementById('main-content').innerHTML = buildPanel(ds);
  requestAnimationFrame(() => renderChart(ds));
}

// Load results.json then render
fetch('results.json')
  .then(r => r.json())
  .then(data => {
    DATA = data;
    document.getElementById('main-content').innerHTML = buildPanel('DATA1');
    requestAnimationFrame(() => renderChart('DATA1'));
  })
  .catch(err => {
    document.getElementById('loading').textContent = 'Error loading results.json: ' + err;
  });
</script>
</body>
</html>
